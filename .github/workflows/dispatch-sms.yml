# Primary scheduled-SMS trigger (free, Hobby-safe).
# Vercel Hobby allows only daily crons, so vercel.json keeps a once-daily
# fallback while this workflow pings the dispatch endpoint every 5 minutes.
# Execution still runs inside Vercel serverless — only the timer lives here.
#
# Required repo secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   APP_URL      e.g. https://your-app.vercel.app (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
name: dispatch-scheduled-sms

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger SMS dispatch
        run: |
          curl -fsS -m 50 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/dispatch-sms"
